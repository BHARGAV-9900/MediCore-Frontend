
<h2 mat-dialog-title>

    Delete Department

</h2>

<mat-dialog-content>

    Are you sure you want to delete

    <strong>{{ data.name }}</strong> ?

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-raised-button
        color="warn"
        (click)="delete()">

        Delete

    </button>

</mat-dialog-actions>
