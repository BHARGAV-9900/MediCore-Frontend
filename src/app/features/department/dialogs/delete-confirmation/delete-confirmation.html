<div class="delete-dialog">

  <div class="delete-icon">

    <mat-icon>
      delete_outline
    </mat-icon>

  </div>


  <div class="delete-content">

    <h2>
      Delete Department
    </h2>


    <p>
      Are you sure you want to delete this department?
    </p>


    <div class="details-card">

      <div class="detail-row">

        <span class="label">
          Department
        </span>

        <span class="value">
          {{ data.name }}
        </span>

      </div>


      @if (data.description) {

        <div class="detail-row">

          <span class="label">
            Description
          </span>

          <span class="value">
            {{ data.description }}
          </span>

        </div>

      }

    </div>


    <p class="warning">
      This action cannot be undone.
    </p>

  </div>


  <div class="dialog-actions">

    <button
      mat-button
      type="button"
      (click)="cancel()">

      Cancel

    </button>


    <button
      mat-flat-button
      type="button"
      class="delete-button"
      (click)="delete()">

      <mat-icon>
        delete
      </mat-icon>

      Delete

    </button>

  </div>

</div>
