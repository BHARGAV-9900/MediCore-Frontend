<h2 mat-dialog-title>

  Delete Appointment

</h2>


<mat-dialog-content>

  <p class="confirmation-message">

    Are you sure you want to delete this appointment?

  </p>


  <div class="appointment-details">

    <div class="detail-row">

      <span class="label">
        Patient
      </span>

      <span class="value">
        {{ data.patientName }}
      </span>

    </div>


    <div class="detail-row">

      <span class="label">
        Doctor
      </span>

      <span class="value doctor">
        {{ data.doctorName }}
      </span>

    </div>


    <div class="detail-row">

      <span class="label">
        Date
      </span>

      <span class="value">
        {{ formattedDate }}
      </span>

    </div>


    <div class="detail-row">

      <span class="label">
        Time
      </span>

      <span class="value">
        {{ formattedTime }}
      </span>

    </div>

  </div>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    Cancel

  </button>


  <button
    mat-raised-button
    color="warn"
    type="button"
    (click)="delete()">

    Delete

  </button>

</mat-dialog-actions>
