<div class="delete-dialog">

  <div class="delete-icon">

    <mat-icon>
      delete_outline
    </mat-icon>

  </div>


  <div class="delete-content">

    <h2>
      Delete Appointment
    </h2>


    <p>
      Are you sure you want to delete this appointment?
    </p>


    <div class="details-card">

      <div class="detail-row">

        <span class="label">
          Patient
        </span>

        <span class="value">
          {{ data.patientName }}
        </span>

      </div>


      <div class="detail-row">

        <span class="label">
          Doctor
        </span>

        <span class="value">
          {{ data.doctorName }}
        </span>

      </div>


      <div class="detail-row">

        <span class="label">
          Date
        </span>

        <span class="value">
          {{ formattedDate }}
        </span>

      </div>


      <div class="detail-row">

        <span class="label">
          Time
        </span>

        <span class="value">
          {{ formattedTime }}
        </span>

      </div>

    </div>


    <p class="warning">
      This action cannot be undone.
    </p>

  </div>


  <div class="dialog-actions">

    <button
      mat-button
      type="button"
      (click)="cancel()">

      Cancel

    </button>


    <button
      mat-flat-button
      type="button"
      class="delete-button"
      (click)="delete()">

      <mat-icon>
        delete
      </mat-icon>

      Delete

    </button>

  </div>

</div>
