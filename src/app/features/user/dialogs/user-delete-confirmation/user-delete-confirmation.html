<div class="delete-dialog">

  <div class="dialog-header">

    <div class="delete-icon">

      <mat-icon>
        delete_outline
      </mat-icon>

    </div>

    <h2>
      Delete User
    </h2>

    <p>
      Are you sure you want to delete this user?
    </p>

  </div>


  <div class="details-card">

    <div class="detail-row">

      <span class="label">
        User ID
      </span>

      <strong>
        #{{ data.user.id }}
      </strong>

    </div>


    <div class="detail-row">

      <span class="label">
        Name
      </span>

      <strong>
        {{ data.user.fullName }}
      </strong>

    </div>


    <div class="detail-row">

      <span class="label">
        Email
      </span>

      <strong>
        {{ data.user.email }}
      </strong>

    </div>


    <div class="detail-row">

      <span class="label">
        Role
      </span>

      <strong>
        {{ data.user.role }}
      </strong>

    </div>


    <div class="detail-row">

      <span class="label">
        Status
      </span>

      <span
        class="status-badge"
        [class.inactive]="!data.user.isActive">

        {{ data.user.isActive ? 'Active' : 'Inactive' }}

      </span>

    </div>

  </div>


  <div class="warning-message">

    This action cannot be undone.

  </div>


  <div class="dialog-divider"></div>


  <div class="dialog-actions">

    <button
      mat-button
      type="button"
      class="cancel-button"
      (click)="cancel()">

      Cancel

    </button>


    <button
      mat-flat-button
      type="button"
      class="delete-button"
      (click)="confirm()">

      <mat-icon>
        delete
      </mat-icon>

      Delete

    </button>

  </div>

</div>
