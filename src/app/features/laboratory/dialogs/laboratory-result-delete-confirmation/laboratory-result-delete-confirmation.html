<div class="delete-dialog">

  <div class="delete-icon">

    <mat-icon>
      delete_outline
    </mat-icon>

  </div>


  <div class="delete-content">

    <h2>
      Delete Laboratory Result
    </h2>


    <p>
      Are you sure you want to delete this laboratory result?
    </p>


    <div class="details-card">

      <div class="detail-row">

        <span class="label">
          Laboratory Result ID
        </span>

        <span class="value">
          #{{ data.laboratoryResultId }}
        </span>

      </div>


      <div class="detail-row">

        <span class="label">
          Laboratory Order ID
        </span>

        <span class="value">
          #{{ data.laboratoryOrderId }}
        </span>

      </div>

    </div>


    <p class="warning">
      This action cannot be undone.
    </p>

  </div>


  <div class="dialog-actions">

    <button
      mat-button
      type="button"
      (click)="cancel()">

      Cancel

    </button>


    <button
      mat-flat-button
      type="button"
      class="delete-button"
      (click)="confirm()">

      <mat-icon>
        delete
      </mat-icon>

      Delete

    </button>

  </div>

</div>
