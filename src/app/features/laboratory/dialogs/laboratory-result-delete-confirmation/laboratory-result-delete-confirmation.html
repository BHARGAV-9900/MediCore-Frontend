<h2 mat-dialog-title>
  Delete Laboratory Result
</h2>


<mat-dialog-content>

  <div class="confirmation-content">

    <div class="warning-icon">

      <mat-icon>
        warning
      </mat-icon>

    </div>


    <div class="confirmation-text">

      <p class="main-message">
        Are you sure you want to delete this laboratory result?
      </p>

      <p class="sub-message">

        Laboratory Result ID:
        <strong>
          #{{ data.laboratoryResultId }}
        </strong>

        <br>

        Laboratory Order ID:
        <strong>
          #{{ data.laboratoryOrderId }}
        </strong>

      </p>

      <p class="warning-message">
        This action cannot be undone.
      </p>

    </div>

  </div>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()">

    Cancel

  </button>


  <button
    mat-flat-button
    color="warn"
    type="button"
    (click)="confirm()">

    <mat-icon>
      delete
    </mat-icon>

    Delete

  </button>

</mat-dialog-actions>
